name: Update Play Store stats
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save google-play-scraper
      - run: node scripts/update-stats.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain stats.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stats.json
            git commit -m "chore: update Play Store stats"
            git push
          fi
